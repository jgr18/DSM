<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSM-werkbank</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="kop">
  <div class="kop-links">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"></rect><rect x="4" y="4" width="5" height="5" fill="currentColor"></rect><rect x="10.5" y="10.5" width="5" height="5" fill="currentColor"></rect><rect x="17" y="17" width="5" height="5" fill="currentColor"></rect><rect x="17" y="4" width="5" height="5" fill="#E07A5F"></rect></svg>
    <span class="merk">DSM-werkbank</span>
    <label class="verborgen" for="modelnaam">Modelnaam</label>
    <input id="modelnaam" class="modelnaam" value="">
  </div>
  <div class="kop-rechts">
    <span id="meta" class="meta"></span>
    <span id="status" class="status"></span>
    <button id="knop-analyse" class="knop-licht">Analyse uitvoeren</button>
    <div class="bestand" role="group" aria-label="Bestand">
      <button data-actie="nieuw" class="knop-donker">Nieuw</button>
      <button data-actie="openen" class="knop-donker">Openen…</button>
      <button data-actie="opslaan" class="knop-donker">Opslaan</button>
      <button data-actie="voorbeeld" class="knop-donker">Voorbeeld</button>
    </div>
    <input id="bestandkiezer" type="file" accept=".json,application/json" hidden>
  </div>
</header>

<nav class="tabbalk" aria-label="Werkstappen">
  <div class="groep" role="group" aria-label="1 Invoer">
    <span class="groeplabel">1 Invoer</span>
    <div class="tabs"><button data-tab="activiteiten">Activiteiten</button><button data-tab="relaties">Relaties</button></div>
  </div>
  <span class="scheiding" aria-hidden="true"></span>
  <div class="groep" role="group" aria-label="2 Analyse">
    <span class="groeplabel">2 Analyse</span>
    <div class="tabs"><button data-tab="analyse">DSM analyse</button><button data-tab="vergelijking">Vergelijking</button><button data-tab="scenarios">Scenario's &amp; tears</button></div>
  </div>
  <span class="scheiding" aria-hidden="true"></span>
  <div class="groep" role="group" aria-label="3 Rapport">
    <span class="groeplabel">3 Rapport</span>
    <div class="tabs"><button data-tab="rapport">Rapportage</button></div>
  </div>
</nav>

<div id="meldingen" class="meldingen" aria-live="polite"></div>
<main id="inhoud" class="inhoud"></main>

<script src="js/model.js"></script>
<script src="js/analyse.js"></script>
<script src="js/voorbeeld.js"></script>
<script src="js/app.js"></script>
</body>
</html>
