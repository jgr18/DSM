<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSM-werkbank — controlevoorbeelden</title>
<link rel="stylesheet" href="css/style.css?v=0.5">
</head>
<body>
<header class="kop"><div class="kop-links"><span class="merk">DSM-werkbank</span> <span class="versie">v0.5</span><span class="meta">Controlevoorbeelden</span></div><div class="kop-rechts"><a href="help.html#controlepagina" style="color:#F4F4F2;margin-right:16px">Help</a><a href="index.html" style="color:#F4F4F2">← Terug naar de werkbank</a></div></header>
<main class="inhoud">
  <section class="paneel breed">
    <div class="rij tussen"><h2>Controle van de rekenkern</h2><span id="samenvatting" class="label-info"></span></div>
    <p class="uitleg">Deze pagina rekent vaste voorbeelden door en vergelijkt de uitkomst met wat er moet uitkomen. Draai haar na elke aanpassing van de code.</p>
    <div class="tabelkader"><table class="lijst"><thead><tr><th>Uitkomst</th><th>Controle</th><th>Wat wordt gecontroleerd</th><th>Detail</th></tr></thead><tbody id="resultaten"></tbody></table></div>
  </section>
</main>
<script src="js/model.js?v=0.5"></script>
<script src="js/analyse.js?v=0.5"></script>
<script src="js/scenario.js?v=0.5"></script>
<script src="js/controle.js?v=0.5"></script>
<script>
  const res = DSM.controle.draaiAlle();
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  document.getElementById('resultaten').innerHTML = res.map(r =>
    '<tr><td>' + (r.ok ? '<span class="label-ok">Geslaagd</span>' : '<span class="label-let" style="background:#FDF0EE;color:#7A1F12">Mislukt</span>') + '</td><td><b>' + esc(r.naam) + '</b></td><td class="klein">' + esc(r.uitleg) + '</td><td class="mono klein">' + esc(r.detail) + '</td></tr>').join('');
  const ok = res.filter(r => r.ok).length;
  document.getElementById('samenvatting').textContent = ok + ' van ' + res.length + ' geslaagd';
</script>
</body>
</html>
